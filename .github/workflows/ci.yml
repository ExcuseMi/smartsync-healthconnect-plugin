name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Commit messages carry no AI lines or em-dashes
        run: |
          DASH=$(printf '\342\200\224')
          if git log --format='%an <%ae>%n%B' | grep -nE "Co-Authored-By|Generated with|Claude|claude\.ai|$DASH"; then
            echo "A commit message names an AI tool or has an em-dash"; exit 1
          fi
          if git log --format='%an' | grep -vx 'ExcuseMi'; then echo "A commit is not authored by ExcuseMi"; exit 1; fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (plugin and plugin interface)
        run: ./gradlew --continue :plugin-api:testDebugUnitTest :healthconnect:testDebugUnitTest

      - name: Lint and release build
        run: ./gradlew :healthconnect:lintDebug :healthconnect:assembleRelease :healthconnect:publishReleasePublicationToMavenLocal

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            healthconnect/build/reports/
            vendor/plugin-api/build/reports/
          if-no-files-found: ignore

      - name: Upload the plugin library
        uses: actions/upload-artifact@v4
        with:
          name: healthconnect-aar
          path: healthconnect/build/outputs/aar/*.aar
